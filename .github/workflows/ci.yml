name: CI

on:
  # Feature branches are covered by their pull_request runs; push runs for them
  # would share the concurrency group and could cancel a PR run carrying the
  # macOS/Windows jobs. Push stays on for refs that run the full job set.
  push:
    branches: [master, 'release/*']
  pull_request:
  schedule:
    - cron: '0 18 * * *'

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.head.repo.full_name || github.repository }}-${{ github.event.pull_request.head.ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  static:
    name: Static checks
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Enable pnpm
        run: corepack enable

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile --ignore-scripts && pnpm rebuild esbuild protobufjs

      - name: Build web
        run: pnpm build:web

      - name: Typecheck
        run: pnpm typecheck

      - name: Build CLI
        run: pnpm build:ci

  test-ubuntu:
    name: Test on ubuntu-latest
    needs: static
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Enable pnpm
        run: corepack enable

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile --ignore-scripts && pnpm rebuild esbuild protobufjs

      - name: Build web
        run: pnpm build:web

      - name: Test
        run: pnpm test:ci

  test-platform:
    name: Test on ${{ matrix.os }}
    needs: static
    if: >
      github.event_name == 'schedule' ||
      (github.event_name == 'pull_request' &&
        (github.base_ref == 'master' || startsWith(github.base_ref, 'release/'))) ||
      (github.event_name == 'push' &&
        (github.ref == 'refs/heads/master' || startsWith(github.ref, 'refs/heads/release/')))
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 35

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Enable pnpm
        run: corepack enable

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile --ignore-scripts && pnpm rebuild esbuild protobufjs

      - name: Build web
        run: pnpm build:web

      - name: Test
        run: pnpm test:ci
