name: CI

on:
  # Feature branches are covered by their pull_request runs; push runs for them
  # would share the concurrency group and could cancel a PR run carrying the
  # macOS/Windows jobs. Push stays on for refs that run the full job set.
  push:
    branches: [master, 'release/*']
  pull_request:
  merge_group:
  schedule:
    - cron: '0 18 * * *'

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.head.repo.full_name || github.repository }}-${{ github.event.pull_request.head.ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  static:
    name: Static checks
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Enable pnpm
        run: corepack enable

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile --ignore-scripts && pnpm rebuild esbuild protobufjs

      - name: Build web
        run: pnpm build:web

      - name: Typecheck
        run: pnpm typecheck

      - name: Build CLI
        run: pnpm build:ci

  test-ubuntu:
    name: Test on ubuntu-latest (shard ${{ matrix.shard }}/2)
    needs: static
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Enable pnpm
        run: corepack enable

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile --ignore-scripts && pnpm rebuild esbuild protobufjs

      - name: Build web
        run: pnpm build:web

      - name: Build CLI
        run: pnpm build:ci

      - name: Test
        run: pnpm test:shard ${{ matrix.shard }}/2

  test-platform:
    name: Test on ${{ matrix.os }} (shard ${{ matrix.shard }}/2)
    needs: static
    if: >
      github.event_name == 'merge_group' ||
      github.event_name == 'schedule' ||
      (github.event_name == 'pull_request' &&
        (github.base_ref == 'master' || startsWith(github.base_ref, 'release/')) &&
        matrix.os == 'windows-latest') ||
      (github.event_name == 'push' &&
        (github.ref == 'refs/heads/master' || startsWith(github.ref, 'refs/heads/release/')))
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
        shard: [1, 2]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Enable pnpm
        run: corepack enable

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile --ignore-scripts && pnpm rebuild esbuild protobufjs

      - name: Build web
        run: pnpm build:web

      - name: Build CLI
        run: pnpm build:ci

      - name: Test
        run: pnpm test:shard ${{ matrix.shard }}/2

  ci-success:
    name: CI success
    if: always()
    needs: [static, test-ubuntu, test-platform]
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Verify required jobs
        env:
          STATIC: ${{ needs.static.result }}
          UBUNTU: ${{ needs.test-ubuntu.result }}
          PLATFORM: ${{ needs.test-platform.result }}
          EVENT: ${{ github.event_name }}
        run: |
          set -eu
          [ "$STATIC" = success ]
          [ "$UBUNTU" = success ]
          if [ "$EVENT" = merge_group ] || [ "$EVENT" = push ] || [ "$EVENT" = schedule ]; then
            [ "$PLATFORM" = success ]
          else
            [ "$PLATFORM" = success ] || [ "$PLATFORM" = skipped ]
          fi
