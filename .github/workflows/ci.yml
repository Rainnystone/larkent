name: CI

on:
  # Feature branches are covered by their pull_request runs; push runs for them
  # would share the concurrency group and could cancel a PR run carrying the
  # macOS/Windows jobs. Push stays on for refs that run the full job set.
  push:
    branches: [master, 'release/*']
  pull_request:
    # Retargeting a PR can change which platform checks are required.
    types: [opened, synchronize, reopened, edited]
  merge_group:
  schedule:
    - cron: '0 18 * * *'

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.head.repo.full_name || github.repository }}-${{ github.event.pull_request.head.ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  static:
    name: Static checks
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Enable pnpm
        run: corepack enable

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile --ignore-scripts && pnpm rebuild esbuild protobufjs

      - name: Build web
        run: pnpm build:web

      - name: Typecheck
        run: pnpm typecheck

      - name: Build CLI
        run: pnpm build:ci

  test-ubuntu:
    name: Test on ubuntu-latest (shard ${{ matrix.shard }}/2)
    needs: static
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Enable pnpm
        run: corepack enable

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile --ignore-scripts && pnpm rebuild esbuild protobufjs

      - name: Build web
        run: pnpm build:web

      - name: Build CLI
        run: pnpm build:ci

      - name: Test
        env:
          LARK_CI_SCHEDULER: weighted
        run: pnpm test:shard ${{ matrix.shard }}/2

  test-windows:
    name: Test on windows-latest (shard ${{ matrix.shard }}/3)
    needs: static
    if: >
      github.event_name == 'merge_group' ||
      github.event_name == 'schedule' ||
      (github.event_name == 'pull_request' &&
        (github.base_ref == 'master' || startsWith(github.base_ref, 'release/'))) ||
      (github.event_name == 'push' &&
        (github.ref == 'refs/heads/master' || startsWith(github.ref, 'refs/heads/release/')))
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3]
    runs-on: windows-latest
    timeout-minutes: 25

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Enable pnpm
        run: corepack enable

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile --ignore-scripts && pnpm rebuild esbuild protobufjs

      - name: Build web
        run: pnpm build:web

      - name: Build CLI
        run: pnpm build:ci

      - name: Test
        env:
          LARK_CI_SCHEDULER: weighted
        run: pnpm test:shard ${{ matrix.shard }}/3

  test-macos:
    name: Test on macos-latest (shard ${{ matrix.shard }}/2)
    needs: static
    if: >
      github.event_name == 'merge_group' ||
      github.event_name == 'schedule' ||
      (github.event_name == 'pull_request' &&
        (github.base_ref == 'master' || startsWith(github.base_ref, 'release/'))) ||
      (github.event_name == 'push' &&
        (github.ref == 'refs/heads/master' || startsWith(github.ref, 'refs/heads/release/')))
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2]
    runs-on: macos-latest
    timeout-minutes: 25

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Enable pnpm
        run: corepack enable

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile --ignore-scripts && pnpm rebuild esbuild protobufjs

      - name: Build web
        run: pnpm build:web

      - name: Build CLI
        run: pnpm build:ci

      - name: Test
        env:
          LARK_CI_SCHEDULER: weighted
        run: pnpm test:shard ${{ matrix.shard }}/2

  ci-success:
    name: CI success
    if: always()
    needs: [static, test-ubuntu, test-windows, test-macos]
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Verify required jobs
        env:
          STATIC: ${{ needs.static.result }}
          UBUNTU: ${{ needs.test-ubuntu.result }}
          WINDOWS: ${{ needs.test-windows.result }}
          MACOS: ${{ needs.test-macos.result }}
          REQUIRE_FULL_MATRIX: ${{ github.event_name != 'pull_request' || github.base_ref == 'master' || startsWith(github.base_ref, 'release/') }}
        run: |
          set -eu
          [ "$STATIC" = success ]
          [ "$UBUNTU" = success ]
          if [ "$REQUIRE_FULL_MATRIX" = true ]; then
            [ "$WINDOWS" = success ]
            [ "$MACOS" = success ]
          else
            [ "$WINDOWS" = success ] || [ "$WINDOWS" = skipped ]
            [ "$MACOS" = success ] || [ "$MACOS" = skipped ]
          fi
